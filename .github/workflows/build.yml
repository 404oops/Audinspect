name: Build/Deploy

on:
  push:
    branches:
      - puter
    tags:
      - "v*"
  pull_request:
    branches:
      - puter

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audinspect-puter
          path: dist/
          if-no-files-found: error

      # publishes dist/ to <PUTER_SUBDOMAIN>.puter.site when the secrets are
      # set (PUTER_AUTH_TOKEN from `puter login`, PUTER_SUBDOMAIN of your choice)
      - name: Deploy to Puter
        if: github.event_name == 'push' && secrets.PUTER_AUTH_TOKEN != ''
        env:
          CI: "true"
          PUTER_AUTH_TOKEN: ${{ secrets.PUTER_AUTH_TOKEN }}
        run: npx puter site deploy dist "${{ secrets.PUTER_SUBDOMAIN }}"
