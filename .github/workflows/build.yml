name: Build/Deploy

on:
  push:
    branches:
      - puter
    tags:
      - "v*"
  pull_request:
    branches:
      - puter

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audinspect-puter
          path: dist/
          if-no-files-found: error

      # `secrets` can't be read in an `if`, so a step turns their presence
      # into an output; the token itself is only exposed to the deploy step
      - name: Check deploy secrets
        id: check
        run: echo "deploy=${{ github.event_name == 'push' && secrets.PUTER_AUTH_TOKEN != '' && secrets.PUTER_SUBDOMAIN != '' }}" >> "$GITHUB_OUTPUT"

      # uploads dist/ to a release folder under ~/Documents/Audinspect on the
      # puter drive, serves it at <PUTER_SUBDOMAIN>.puter.site and
      # creates/updates the puter app. needs the PUTER_AUTH_TOKEN and
      # PUTER_SUBDOMAIN repository secrets; PUTER_APP_NAME / PUTER_APP_DIR
      # are optional repository variables.
      - name: Deploy to Puter
        if: steps.check.outputs.deploy == 'true'
        env:
          CI: "true"
          PUTER_AUTH_TOKEN: ${{ secrets.PUTER_AUTH_TOKEN }}
          PUTER_SUBDOMAIN: ${{ secrets.PUTER_SUBDOMAIN }}
          PUTER_APP_NAME: ${{ vars.PUTER_APP_NAME }}
          PUTER_APP_DIR: ${{ vars.PUTER_APP_DIR }}
        run: node scripts/deploy-puter.mjs
