name: Build/Deploy

on:
  push:
    branches:
      - puter
    tags:
      - "v*"
  pull_request:
    branches:
      - puter

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUTER_AUTH_TOKEN: ${{ secrets.PUTER_AUTH_TOKEN }}
      PUTER_SUBDOMAIN: ${{ secrets.PUTER_SUBDOMAIN }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audinspect-puter
          path: dist/
          if-no-files-found: error

      # uploads dist/ to ~/Documents/Audinspect on the puter drive, serves it
      # at <PUTER_SUBDOMAIN>.puter.site and creates/updates the puter app.
      # needs the PUTER_AUTH_TOKEN and PUTER_SUBDOMAIN repository secrets;
      # PUTER_APP_NAME / PUTER_APP_DIR are optional overrides.
      - name: Deploy to Puter
        if: github.event_name == 'push' && env.PUTER_AUTH_TOKEN != '' && env.PUTER_SUBDOMAIN != ''
        env:
          CI: "true"
          PUTER_APP_NAME: ${{ vars.PUTER_APP_NAME }}
          PUTER_APP_DIR: ${{ vars.PUTER_APP_DIR }}
        run: node scripts/deploy-puter.mjs
